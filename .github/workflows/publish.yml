name: Build & Publish to PyPI

# The only release path. Publishing by hand is what let 0.2.4 ship with local
# __pycache__ in the wheel, and what hid the fact that a build from a clean
# checkout produced an almost empty package. Every gate below exists because
# `python -m build` succeeding says nothing about the artifact being usable.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package and its test dependencies
        # Install from pyproject rather than requirements.txt, so the tests run
        # against the dependency set users actually resolve.
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest build

      - name: Run the test suite
        # A tag must not publish anything the tests have not passed on.
        run: pytest -q

      - name: Build the distribution
        run: |
          rm -rf dist
          python -m build

      - name: Check the tag matches the version that was built
        # Checks the artifact, not the source, so it cannot be fooled by a
        # version string that did not reach the build.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! ls dist/climb_astro-"${version}"-*.whl >/dev/null 2>&1; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built artifacts."
            echo "Update the version in pyproject.toml, CLiMB/__init__.py and docs/source/conf.py."
            ls -1 dist/
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches dist/climb_astro-${version}-*.whl"

      - name: Verify the wheel is complete and importable
        # The failure this guards against is silent: a wheel holding nothing but
        # an empty CLiMB/__init__.py builds and uploads without complaint.
        # Installing into a clean venv and importing from outside the checkout is
        # what tells the two apart -- run from the repository, Python would import
        # the source tree and every check would pass on a broken wheel.
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import CLiMB
          from CLiMB.core.CLiMB import CLiMB as Climb
          from CLiMB.core.KBound import KBound
          from CLiMB.exploratory import ExploratoryClusteringBase
          from CLiMB.exploratory.DBSCANExploratory import DBSCANExploratory
          from CLiMB.exploratory.HDBSCANExploratory import HDBSCANExploratory
          from CLiMB.exploratory.OPTICSExploratory import OPTICSExploratory
          from CLiMB.explain import cluster_signatures, plot_gate_accounting
          from CLiMB.utils.util import cohens_d

          for name in ("explain", "decision_path", "feature_attribution"):
              holder = Climb if name == "explain" else KBound
              assert hasattr(holder, name), f"{holder.__name__}.{name} missing from the wheel"

          print("installed", CLiMB.__version__, "from", CLiMB.__file__)
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
